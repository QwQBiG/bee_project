tracker:
  model_path: "artifacts/models/hive_entrance_bee_yolov8n.pt"
  conf_threshold: 0.10
  iou_threshold: 0.45
  device: null
  imgsz: 1280
  tracker_type: "botsort"
  tracker_config: "botsort.yaml"
  max_age: 10
  min_confidence: 0.10

behavior:
  min_tracklet_length: 5
  intensity_window: 30
  density_grid: [10, 10]
  frame_size: [720, 1080]

# 花粉团候选分析。入口区域为相对坐标 [x, y, width, height]，须按相机画面标定。
pollen_analysis:
  enabled: true
  entrance_region: [0.40, 0.40, 0.20, 0.25]
  # OpenCV HSV 黄/橙色范围；不同光源和花粉颜色应使用标注样本重新标定。
  hsv_lower: [15, 70, 70]
  hsv_upper: [45, 255, 255]
  min_color_ratio: 0.12
  min_samples: 3
  positive_sample_ratio: 0.60
  min_inbound_events: 8
  min_pollen_ratio: 0.15

visualization:
  show_tracks: true
  show_detections: true
  show_labels: true
  show_confidence: true
  track_line_width: 2
  bbox_line_width: 2
  font_scale: 0.5
  colormap: "hsv"

inference:
  save_video: true
  save_tracks: true
  save_behavior: true
  output_fps: 60
  visualization: true
