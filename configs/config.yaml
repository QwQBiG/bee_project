# 智慧养蜂蜜蜂识别项目配置

# 巢外跟踪器配置（多模态模式使用）
outside_tracker:
  model_path: "artifacts/models/hive_entrance_bee_yolov8n.pt"
  conf_threshold: 0.10
  iou_threshold: 0.45
  imgsz: 1280
  tracker_type: "botsort"
  tracker_config: "botsort.yaml"
  max_age: 10
  min_confidence: 0.10

# 巢内跟踪器配置（多模态模式使用）
inside_tracker:
  model_path: "artifacts/models/honey_bee_detector_yolov8s.pt"
  conf_threshold: 0.15
  iou_threshold: 0.45
  use_enhancement: true
  tracker_type: "bytetrack"
  tracker_config: "bytetrack.yaml"
  max_age: 30
  min_hits: 2

## 模型配置
model:
  # 巢外可见光检测模型
  outside_detector:
    model_type: "yolov8"
    model_size: "m"  # n, s, m, l, x
    checkpoint: "yolov8m.pt"
    input_size: 640
    conf_threshold: 0.25
    iou_threshold: 0.45
    device: "cuda:0"

  # 巢内红外检测模型
  inside_detector:
    model_type: "yolov8"
    model_size: "m"
    checkpoint: "yolov8m.pt"
    input_size: 640
    conf_threshold: 0.2
    iou_threshold: 0.45
    device: "cuda:0"

  # 跟踪器配置
  tracker:
    type: "botsort"    # botsort, bytetrack；实际推理使用顶层 tracker_type
    max_age: 30        # 最大丢失帧数
    min_confidence: 0.3

## 数据配置
data:
  # 巢外数据
  outside:
    video_path: "data/outside_hive"
    annotation_path: "datasets/outside_annotations"
    train_split: 0.7
    val_split: 0.15
    test_split: 0.15

  # 巢内数据
  inside:
    video_path: "data/inside_hive"
    annotation_path: "datasets/inside_annotations"
    train_split: 0.7
    val_split: 0.15
    test_split: 0.15

## 训练配置
training:
  outside_model:
    epochs: 100
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0005
    optimizer: "AdamW"
    scheduler: "cosine"
    augmentation: true
    early_stopping_patience: 10

  inside_model:
    epochs: 100
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0005
    optimizer: "AdamW"
    scheduler: "cosine"
    augmentation: true
    early_stopping_patience: 10

## 行为量化配置
behavior:
  # 个体行为指标
  individual:
    velocity_threshold: 50        # 像素/帧
    direction_bins: 8             # 方向量化 bins
    staying_threshold: 100       # 停留帧数阈值
    activity_intensity_window: 30  # 活动强度窗口

  # 群体行为指标
  group:
    density_grid_size: 100        # 密度网格大小
    aggregation_threshold: 10     # 聚集检测阈值
    activity_calm_threshold: 0.3  # 活跃/安静阈值

# 巢内红外视频的可解释分析阈值。速度单位为像素/帧，需按相机视角标定。
inside_metrics:
  density_grid: [10, 10]
  stationary_speed: 0.6
  stationary_min_frames: 30
  pose_mismatch_degrees: 75
  pose_min_speed: 1.0
  cluster_share_threshold: 0.20

## 可视化配置
visualization:
  show_tracks: true
  show_labels: true
  show_confidence: true
  track_line_width: 2
  bbox_line_width: 2
  font_scale: 0.5
  colormap: "hsv"  # hsv, rainbow, jet

## 推理配置
inference:
  batch_size: 1
  save_video: true
  save_tracks: true
  save_behavior: true
  output_fps: 30
  visualization: true
